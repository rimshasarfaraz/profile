<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Document metadata and shared assets -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content=""
    />
    <title data-content="pageTitle"></title>
    <link rel="icon" type="image/png" href="logo.png" />

    <!-- Typography and page styles -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <!-- Page layout -->
    <div class="wrap">
      <div class="content-column">
        <!-- Site identity and tab navigation -->
        <nav class="tab-nav" aria-label="Sections">
          <div class="nav-brand">
            <h1 class="header-logo" data-content="name"></h1>
            <p class="header-pronunciation" data-content="pronunciation"></p>
          </div>

          <!-- Tab labels and their matching panels -->
          <div class="tab-list" role="tablist" aria-label="Site sections">
            <button
              class="tab-btn active"
              role="tab"
              id="tab-btn-about"
              aria-selected="true"
              aria-controls="tab-about"
              tabindex="0"
              data-tab="about"
            >
              <span data-content="aboutTab"></span>
            </button>
            <button
              class="tab-btn"
              role="tab"
              id="tab-btn-publications"
              aria-selected="false"
              aria-controls="tab-publications"
              tabindex="-1"
              data-tab="publications"
            >
              <span data-content="publicationsTab"></span>
            </button>
            <button
              class="tab-btn"
              role="tab"
              id="tab-btn-cv"
              aria-selected="false"
              aria-controls="tab-cv"
              tabindex="-1"
              data-tab="cv"
            >
              <span data-content="cvTab"></span>
            </button>
          </div>
        </nav>

        <!-- Main tab content -->
        <main id="main" tabindex="-1">
          <!-- About: portrait, contact links, and biography -->
          <div
            class="tab-panel active"
            id="tab-about"
            role="tabpanel"
            aria-labelledby="tab-btn-about"
            tabindex="0"
          >
            <h2 class="sr-only" data-content="aboutHeading"></h2>
            <div class="home-content">
              <!-- Portrait and contact information -->
              <div class="portrait-column">
                <img
                  class="home-portrait"
                  src="pic.svg"
                  alt="Profile photo"
                  width="800"
                  height="789"
                />
                <div class="header-meta">
                  <div class="email-row">
                    <a data-content="email" href="mailto:"></a>
                    <button
                      class="copy-email"
                      type="button"
                    >
                      <svg
                        aria-hidden="true"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.8"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                      >
                        <rect x="8" y="8" width="12" height="12" rx="2"></rect>
                        <path
                          d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"
                        ></path>
                      </svg>
                    </button>
                  </div>
                  <a
                    class="social-link"
                    href="https://scholar.google.com/citations?user=4zvTwBsAAAAJ&amp;hl=en&amp;oi=ao"
                    target="_blank"
                    rel="noopener"
                    data-content="scholar"
                  ></a>
                  <a
                    class="social-link"
                    href="https://www.linkedin.com/in/rimsha-sarfaraz"
                    target="_blank"
                    rel="noopener"
                    data-content="linkedIn"
                  ></a>
                </div>
                <h3 class="research-heading honors-heading" id="honors-heading" data-content="honorsHeading"></h3>
                <ul class="honors-list" aria-labelledby="honors-heading" data-content-list="awards">
                </ul>
              </div>

              <!-- Biography text -->
              <div class="home-bio-copy">
                <p class="home-bio" data-content-html="biographyCurrent"></p>
                <p class="home-bio" data-content-html="biographyPrevious"></p>
                <div data-content-html="biographyResearch"></div>
              </div>
            </div>
          </div>

          <!-- CV: embedded PDF -->
          <div
            class="tab-panel"
            id="tab-cv"
            role="tabpanel"
            aria-labelledby="tab-btn-cv"
            tabindex="0"
          >
            <h2 class="sr-only" data-content="cvHeading"></h2>
            <div class="cv-frame-wrap">
              <iframe
                src="CV.pdf#toolbar=0&amp;navpanes=0"
                loading="lazy"
              ></iframe>
            </div>
          </div>

          <!-- Publications: entries grouped by year -->
          <div
            class="tab-panel"
            id="tab-publications"
            role="tabpanel"
            aria-labelledby="tab-btn-publications"
            tabindex="0"
          >
            <h2 class="sr-only" data-content="publicationsHeading"></h2>

            <!-- Add each publication year as a separate group -->
            <div class="pub-year-group">
              <h3 class="pub-year-label" data-content="publicationYear"></h3>
              <div class="pub-entries">
                <article class="pub-entry">
                  <!-- Conference and award labels -->
                  <div class="pub-entry-meta">
                    <span class="pub-entry-venue" data-content="publicationVenue"></span>
                    <span class="pub-entry-award">
                      <span aria-hidden="true">★</span>
                      <span data-content="publicationAward"></span>
                    </span>
                  </div>

                  <!-- Publication title and author list -->
                  <h4 class="pub-entry-title" data-content="publicationTitle"></h4>
                  <p class="pub-entry-authors" data-content-html="publicationAuthors"></p>

                  <!-- Paper and presentation resources -->
                  <div class="pub-entry-links">
                    <a class="pub-link" href="https://dl.acm.org/doi/full/10.1145/3706598.3713297" target="_blank" rel="noopener">
                      <span data-content="publicationPaper"></span>
                    </a>
                    <a class="pub-link" href="https://www.youtube.com/watch?v=PihhYUnPwls" target="_blank" rel="noopener">
                      <span data-content="publicationTalk"></span>
                    </a>
        
                  </div>
                </article>
              </div>
            </div>
          </div>
        </main>
      </div>
    </div>

    <!-- Site footer -->
    <footer class="page-footer">
      <small data-content="footer"></small>
    </footer>

    <!-- Tab switching and email-copy behavior -->
    <script src="content.js"></script>
    <script>
      const { text, html, lists, attributes } = window.siteContent;

      Object.entries(text).forEach(([key, value]) => {
        const target = document.querySelector(`[data-content="${key}"]`);
        if (!target) {
          throw new Error(`Missing text content target: ${key}`);
        }
        target.textContent = value;
      });

      Object.entries(html).forEach(([key, value]) => {
        const target = document.querySelector(`[data-content-html="${key}"]`);
        if (!target) {
          throw new Error(`Missing rich-text content target: ${key}`);
        }
        target.innerHTML = value;
      });

      Object.entries(lists).forEach(([key, values]) => {
        const target = document.querySelector(`[data-content-list="${key}"]`);
        if (!target) {
          throw new Error(`Missing list content target: ${key}`);
        }
        target.replaceChildren(...values.map((value) => {
          const item = document.createElement('li');
          item.textContent = value;
          return item;
        }));
      });

      Object.values(attributes).forEach(({ selector, name, value, contentKey, prefix }) => {
        const target = document.querySelector(selector);
        if (!target) {
          throw new Error(`Missing content attribute target: ${selector}`);
        }
        const contentValue = contentKey ? `${prefix || ''}${text[contentKey]}` : value;
        target.setAttribute(name, contentValue);
      });

      // Tab navigation: keep selected state, visible panel, and URL hash in sync.
      const tabButtons = Array.from(document.querySelectorAll('.tab-btn'));
      const tabPanels = Array.from(document.querySelectorAll('.tab-panel'));

      function showTab(name, updateLocation = true) {
        if (!tabButtons.some((button) => button.dataset.tab === name)) {
          return;
        }

        tabButtons.forEach((button) => {
          const isActive = button.dataset.tab === name;
          button.classList.toggle('active', isActive);
          button.setAttribute('aria-selected', String(isActive));
          button.tabIndex = isActive ? 0 : -1;
        });

        tabPanels.forEach((panel) => {
          panel.classList.toggle('active', panel.id === `tab-${name}`);
        });

        if (updateLocation && window.location.hash !== `#${name}`) {
          window.history.replaceState(null, '', `#${name}`);
        }
      }

      tabButtons.forEach((button) => {
        button.addEventListener('click', () => showTab(button.dataset.tab));
      });

      const initialTab = window.location.hash.slice(1) || 'about';
      showTab(initialTab, false);
      window.addEventListener('hashchange', () => {
        showTab(window.location.hash.slice(1), false);
      });

      // Email copy: briefly show success styling after copying the address.
      const copyEmailButton = document.querySelector('.copy-email');
      const emailLink = document.querySelector('.email-row a[href^="mailto:"]');
      let copyFeedbackTimeout;

      copyEmailButton.addEventListener('click', async () => {
        try {
          if (!navigator.clipboard?.writeText) {
            throw new Error('Clipboard access is unavailable in this browser context.');
          }

          await navigator.clipboard.writeText(emailLink.href.slice('mailto:'.length));
          copyEmailButton.classList.add('copied');
          clearTimeout(copyFeedbackTimeout);
          copyFeedbackTimeout = setTimeout(() => {
            copyEmailButton.classList.remove('copied');
          }, 250);
        } catch (error) {
          console.error('Unable to copy email address:', error);
        }
      });
    </script>
  </body>
</html>
